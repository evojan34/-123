name: Flutter Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    - name: Setup Full Project Structure
      run: |
        # إنشاء مشروع فلاتر كامل وجديد لإنشاء ملفات أندرويد تلقائياً
        flutter create --project-name mobile_clinic_cashier --org com.clinic.pos temp_app
        # نقل ملفات أندرويد الرسمية إلى المستودع
        cp -r temp_app/android ./
        rm -rf temp_app

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: clinic-pos-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
