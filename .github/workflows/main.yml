name: Build Clinic Cashier APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android Project & Fix Permissions & SDK
        run: |
          if [ ! -d "android" ]; then
            flutter create . --project-name clinic_cashier_app --platforms android
          fi

          # رفع الحد الأدنى لنظام أندرويد إلى 21
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true

          # إضافة صلاحيات USB Host و OTG
          sed -i '/<manifest/a <uses-feature android:name="android.hardware.usb.host" android:required="false" \/>\n<uses-permission android:name="android.permission.USB_PERMISSION" \/>' android/app/src/main/AndroidManifest.xml || true

          # تصحيح توافق كوتلن
          find $HOME/.pub-cache -name "*.gradle" -exec sed -i 's/1.3.50/1.8.22/g' {} + || true
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: clinic-cashier-app
          path: build/app/outputs/flutter-apk/app-release.apk
