name: Build Clinic Cashier APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android Project & Fix Min SDK to 21
        run: |
          # إنشاء مجلد الأندرويد باسم حزمة صالح يتجاهل علامة السالب في اسم المستودع
          if [ ! -d "android" ]; then
            flutter create . --project-name clinic_cashier_app --platforms android
          fi
          # رفع الحد الأدنى لنظام أندرويد إلى 21 لتشغيل قارئ الباركود
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: clinic-cashier-app
          path: build/app/outputs/flutter-apk/app-release.apk
